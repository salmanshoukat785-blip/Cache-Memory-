name: Build APK

# Runs on every push to main/master and can also be started by hand
# (Actions tab -> Build APK -> Run workflow).
#
# Two ways to use it:
#   1. The repository contains the Gradle project directly (settings.gradle.kts in the root).
#   2. The repository contains only a .zip of the project in its root; the workflow unzips it.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate project (unzip if a .zip was uploaded)
        shell: bash
        run: |
          shopt -s nullglob
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            echo "Project found in the repository root."
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            zips=( *.zip )
            if [ ${#zips[@]} -eq 0 ]; then
              echo "::error::No Gradle project and no .zip file found in the repository root."
              exit 1
            fi
            zip_file="$(ls -t "${zips[@]}" | head -n1)"
            echo "Unzipping $zip_file"
            mkdir -p _project
            unzip -q -o "$zip_file" -d _project
            settings="$(find _project \( -name settings.gradle.kts -o -name settings.gradle \) | head -n1)"
            if [ -z "$settings" ]; then
              echo "::error::settings.gradle(.kts) not found inside $zip_file"
              exit 1
            fi
            echo "PROJECT_DIR=$(dirname "$settings")" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is needed: this installs Gradle 8.9 (required by AGP 8.7).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      # Tests must not block the APK, so a failure here is reported but not fatal.
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SDCacheManager-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports
          if-no-files-found: ignore
          
